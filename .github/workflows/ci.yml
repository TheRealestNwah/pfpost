name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Windows, Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff; python -m pip install -r requirements.txt

      - name: Lint production code
        run: python -m ruff check --select F,E9 pfpost build.py pfpost.py

      - name: Run core tests
        run: python test_pfpost.py

      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_gui.py
