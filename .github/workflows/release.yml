name: Release

# Builds both executables in CI and attaches them to a draft release. The draft
# gets the download table and checksums; publish it with the Publish release
# workflow (or by hand from the Releases page). Nothing is published here.
#
# Start it either way:
# - Run this workflow from the Actions tab on main. It reads __version__ from
#   pfpost/__init__.py and, once the build passes, tags that commit vX.Y.Z.
# - Or push the tag yourself (git tag v1.2.0 && git push origin v1.2.0).
#
# To rebuild an existing tag's draft, run it again from main (if main is still
# on the tagged commit) or pick the tag under "Use workflow from".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches pfpost/__init__.py
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Work out the release tag
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pfpost/__init__.py)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ \"$version\" in pfpost/__init__.py"
              exit 1
            fi
          else
            default=$(gh api "repos/$GH_REPO" --jq .default_branch)
            if [ "$GITHUB_REF_NAME" != "$default" ]; then
              echo "::error::Run this workflow from $default or a version tag, not the $GITHUB_REF_NAME branch"
              exit 1
            fi
            # An existing tag must already point here; otherwise main has moved
            # on since that release and needs a version bump first.
            if tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null); then
              if [ "$tagged" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already exists on $tagged, not $GITHUB_SHA. Bump __version__ before releasing again."
                exit 1
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

  build:
    name: Build and test
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    name: Attach to draft release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check-version.outputs.tag }}
    steps:
      - name: Download tested executables
        uses: actions/download-artifact@v4
        with:
          name: pfpost-windows
          path: dist

      - name: Write draft notes
        run: |
          cd dist
          gui=$(sha256sum pfpost-gui.exe | cut -d' ' -f1)
          cli=$(sha256sum pfpost.exe | cut -d' ' -f1)
          cat > ../notes.md <<EOF
          <!-- Built by the Release workflow from $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID -->
          <!-- Write the summary and changes, then publish. -->

          ## Download

          | File | For |
          |---|---|
          | \`pfpost-gui.exe\` | the desktop app |
          | \`pfpost.exe\` | the command line and background-posting task |

          No Python needed. **Keep both files in the same folder**, and replace both when upgrading. Your account, queue, drafts, and options carry over.

          Windows will warn about an unsigned binary from an unknown publisher. That is expected; this project does not have a code-signing certificate. Build it yourself if you would rather not trust the download (see the README).

          \`\`\`
          SHA256  pfpost-gui.exe  $gui
          SHA256  pfpost.exe      $cli
          \`\`\`
          EOF
          cat ../notes.md

      - name: Tag this commit
        if: github.ref_type != 'tag'
        run: |
          if tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG was created on $tagged while this run was building $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG already points at $GITHUB_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Create or update the draft release
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; not replacing its files"
              exit 1
            fi
            # A re-run replaces the files but keeps any notes already written.
            gh release upload "$TAG" dist/pfpost.exe dist/pfpost-gui.exe --clobber
          else
            gh release create "$TAG" dist/pfpost.exe dist/pfpost-gui.exe \
              --draft --verify-tag \
              --title "pfpost ${TAG#v}" \
              --notes-file notes.md
          fi
